# Example configuration for claude-orchestrator.
# Copy this file to config/orchestrator.yaml and edit the values for your machine.

schedule:
  start: "2026-06-13 22:00"        # local time; the orchestrator sleeps until this moment
  end: "2026-06-14 06:00"          # hard stop; no new task starts or continues past this
  timezone: "America/New_York"     # optional IANA timezone; omit to use system local time

scope:
  # Folders the agent may READ and SEARCH (Windows host and WSL2 distributions).
  # WRITE access is NOT configured here. A folder becomes writable only for the single
  # task whose instruction markdown names it as the target repository.
  read:
    - "E:/GitHub"
    - "//wsl$/Ubuntu/home/user/projects"      # UNC form of a WSL path on the Windows host

defaults:
  model: null                      # null uses the Claude Code default for your plan
  max_turns: 200                   # per-task cap on agentic turns (safety limit)
  permission_mode: "default"       # the in-code permission callback does the real gating
  commit_interval_minutes: 30      # how often a long task should commit progress
  push: true                       # push commits to the remote by default
  usage_checkpoint_minutes: 5      # how often accumulated token usage is logged

limits:
  max_cost_usd: null               # optional cumulative spend cap; null disables it
  max_total_turns: null            # optional cumulative turn cap; null disables it
