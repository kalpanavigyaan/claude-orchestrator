<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' http://127.0.0.1:4318; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:4318 ws://127.0.0.1:4318" />
  <title>Fleet Console</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     TITLE BAR
════════════════════════════════════════════════════════════ -->
<div class="title-bar" id="title-bar">
  <div class="title-bar-left">
    <svg class="app-logo" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 1L14 4.5V11.5L8 15L2 11.5V4.5L8 1Z" stroke="#007acc" stroke-width="1.5" fill="none"/>
      <circle cx="8" cy="8" r="2" fill="#007acc"/>
    </svg>
    <span class="title-bar-title">Fleet Console</span>
  </div>
  <div class="title-bar-drag"></div>
  <div class="title-bar-right">
    <span id="conn" class="conn-status offline" title="Connection status">offline</span>
    <div class="window-controls">
      <button class="wc-btn minimize" id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button class="wc-btn maximize" id="btn-maximize" title="Maximize">
        <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" fill="none"/></svg>
      </button>
      <button class="wc-btn close" id="btn-close" title="Close">
        <svg viewBox="0 0 10 10">
          <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/>
          <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     WORKBENCH  (activity bar + sidebar + editor)
════════════════════════════════════════════════════════════ -->
<div class="workbench">

  <!-- ─── LEFT ACTIVITY BAR ────────────────────────────────── -->
  <nav class="activity-bar" aria-label="Activity Bar">
    <div class="ab-actions">
      <button class="ab-action-btn" id="btn-new-session" title="New Session (Ctrl+N)">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="ab-action-btn" id="btn-set-reset" title="Set Account Reset Time">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M8 4v4l3 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="ab-bottom">
      <div class="ab-countdown" id="account-countdown" title="Account reset countdown">—</div>
    </div>
  </nav>

  <!-- ─── LEFT SIDEBAR  (3 always-open panes) ─────────────── -->
  <div class="sidebar" id="sidebar">

    <!-- Active Sessions -->
    <div class="lp-pane" id="lp-sessions" style="height:180px">
      <div class="lp-header">
        Active Sessions
        <span class="ab-badge hidden" id="sessions-badge"></span>
      </div>
      <div class="lp-body" id="sessions-list"></div>
    </div>
    <div class="lp-vresize" id="vr-1"></div>

    <!-- Session History -->
    <div class="lp-pane lp-grow" id="lp-history">
      <div class="lp-header">
        Session History
        <button class="panel-title-btn" id="btn-refresh-history" title="Refresh">↻</button>
      </div>
      <input class="panel-filter" id="history-filter" placeholder="Filter sessions…" />
      <div class="lp-body tree-view" id="history-tree"></div>
    </div>
    <div class="lp-vresize" id="vr-2"></div>

    <!-- Controls -->
    <div class="lp-pane" id="lp-controls" style="height:230px">
      <div class="lp-header">Controls</div>
      <div class="lp-body" id="controls-content"></div>
    </div>

    <div class="sidebar-resize-handle" id="sidebar-resize"></div>
  </div>

  <!-- ─── EDITOR AREA ──────────────────────────────────────── -->
  <div class="editor-area">
    <div class="editor-tabs">
      <div class="editor-tab active" id="tab-chat" data-view="chat">
        <svg viewBox="0 0 14 14" fill="currentColor" style="width:12px;height:12px"><path d="M2 2h10a1 1 0 011 1v6a1 1 0 01-1 1H8l-3 3v-3H2a1 1 0 01-1-1V3a1 1 0 011-1z"/></svg>
        Chat
      </div>
    </div>
    <div class="chat-view" id="chat-view">
      <div class="chat-header" id="chat-header">
        <span class="chat-header-title" id="chat-title">Select or create a session</span>
        <span class="chat-header-meta" id="chat-meta"></span>
      </div>
      <div class="messages" id="messages"></div>
      <div id="working" class="working hidden">
        <div class="working-status">
          <span class="dots"><i></i><i></i><i></i></span>
          <span id="working-text">Claude is working…</span>
          <button id="working-stop" class="working-stop-btn" title="Stop current task (keeps session)">⏹ Stop</button>
        </div>
        <div id="working-cmd" class="working-cmd"></div>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="composer-input" rows="3" placeholder="Message the agent… (Enter to send, Shift+Enter for newline)"></textarea>
        <div class="composer-actions">
          <button type="submit" class="btn-primary" id="btn-send">Send</button>
        </div>
      </form>
    </div>
  </div><!-- editor-area -->

  <!-- ─── RIGHT SIDEBAR (5 panels) ────────────────────────── -->
  <div class="right-sidebar" id="right-sidebar">

    <!-- Usage panel with 6 tabs -->
    <div class="rp-panel active" id="rpanel-usage">
      <div class="rp-header rp-header-tabs">
        <div class="rp-tabs" id="usage-tabs">
          <button class="rp-tab active" data-utab="overview">Overview</button>
          <button class="rp-tab" data-utab="daily">Daily</button>
          <button class="rp-tab" data-utab="monthly">Monthly</button>
          <button class="rp-tab" data-utab="models">Models</button>
          <button class="rp-tab" data-utab="sessions-hist">Sessions</button>
          <button class="rp-tab" data-utab="scatter">Scatter</button>
        </div>
      </div>
      <div class="rp-body" id="rpanel-usage-body"><div class="rp-hint">Loading…</div></div>
    </div>

    <!-- WSL Distros panel -->
    <div class="rp-panel" id="rpanel-wsl">
      <div class="rp-header">
        <svg viewBox="0 0 16 16" fill="currentColor" style="width:13px;height:13px;flex-shrink:0"><rect x="1" y="2" width="14" height="10" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M3.5 6l2.5 2-2.5 2M8.5 10h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        WSL Distros
        <button class="panel-title-btn" id="btn-refresh-wsl" title="Refresh" style="margin-left:auto">↻</button>
      </div>
      <div class="rp-body" id="wsl-list"></div>
    </div>

    <!-- Intelligence panel -->
    <div class="rp-panel" id="rpanel-intelligence">
      <div class="rp-header">
        <svg viewBox="0 0 16 16" fill="currentColor" style="width:13px;height:13px;flex-shrink:0"><path d="M6 2a4 4 0 014 4v.5h1.5a2.5 2.5 0 010 5h-7A2.5 2.5 0 012 9a2.5 2.5 0 012-2.45V6a4 4 0 014-4zm0 1.2A2.8 2.8 0 003.2 6v.88l-.58.16A1.3 1.3 0 004.5 10.5h7a1.3 1.3 0 000-2.6H9.2V6A2.8 2.8 0 006 3.2z"/></svg>
        Intelligence
      </div>
      <div class="rp-body" id="intelligence-content"></div>
    </div>

    <!-- Commands panel -->
    <div class="rp-panel" id="rpanel-commands">
      <div class="rp-header">
        <svg viewBox="0 0 16 16" fill="currentColor" style="width:13px;height:13px;flex-shrink:0"><path d="M7.5 1.5a6 6 0 104.33 10.16l2.47 2.47.7-.71-2.47-2.47A6 6 0 007.5 1.5zm0 1.2a4.8 4.8 0 110 9.6 4.8 4.8 0 010-9.6zM7 5.5V4H5.5v1.5H4V7h1.5v1.5H7V7h1.5V5.5H7z"/></svg>
        Commands
      </div>
      <input class="panel-filter" id="cmd-filter" placeholder="Filter commands…" style="margin:6px 8px;width:calc(100% - 16px)" />
      <div class="rp-body" id="cmd-list"></div>
    </div>

    <!-- Repositories panel -->
    <div class="rp-panel" id="rpanel-repos">
      <div class="rp-header">
        <svg viewBox="0 0 16 16" fill="currentColor" style="width:13px;height:13px;flex-shrink:0"><path d="M2 2.5a.5.5 0 01.5-.5h3a.5.5 0 010 1H3v9h10V8.5a.5.5 0 011 0V13a.5.5 0 01-.5.5H2.5A.5.5 0 012 13V2.5zM8 2h5.5a.5.5 0 01.5.5V8a.5.5 0 01-1 0V3.7L8.35 8.35a.5.5 0 01-.7-.7L12.3 3H8a.5.5 0 010-1z"/></svg>
        Repositories
      </div>
      <div class="rp-body tree-view repos-tree" id="repos-tree"></div>
    </div>

  </div><!-- right-sidebar -->

  <!-- ─── RIGHT ACTIVITY BAR ───────────────────────────────── -->
  <nav class="right-ab" id="right-ab" aria-label="Right Activity Bar">
    <button class="rab-icon active" data-rpanel="usage" title="Usage Statistics">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 12L5 7l3 3 5-6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="rab-icon" data-rpanel="wsl" title="WSL Distros">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="10" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M3.5 6l2.5 2-2.5 2M8.5 10h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <button class="rab-icon" data-rpanel="intelligence" title="Intelligence / Tool Server">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 2a4 4 0 014 4v.5h1.5a2.5 2.5 0 010 5h-7A2.5 2.5 0 012 9a2.5 2.5 0 012-2.45V6a4 4 0 014-4zm0 1.2A2.8 2.8 0 003.2 6v.88l-.58.16A1.3 1.3 0 004.5 10.5h7a1.3 1.3 0 000-2.6H9.2V6A2.8 2.8 0 006 3.2z"/></svg>
    </button>
    <button class="rab-icon" data-rpanel="commands" title="Slash Commands">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M7.5 1.5a6 6 0 104.33 10.16l2.47 2.47.7-.71-2.47-2.47A6 6 0 007.5 1.5zm0 1.2a4.8 4.8 0 110 9.6 4.8 4.8 0 010-9.6zM7 5.5V4H5.5v1.5H4V7h1.5v1.5H7V7h1.5V5.5H7z"/></svg>
    </button>
    <button class="rab-icon" data-rpanel="repos" title="Repositories">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5a.5.5 0 01.5-.5h3a.5.5 0 010 1H3v9h10V8.5a.5.5 0 011 0V13a.5.5 0 01-.5.5H2.5A.5.5 0 012 13V2.5zM8 2h5.5a.5.5 0 01.5.5V8a.5.5 0 01-1 0V3.7L8.35 8.35a.5.5 0 01-.7-.7L12.3 3H8a.5.5 0 010-1z"/></svg>
    </button>
  </nav>

</div><!-- workbench -->

<!-- ═══════════════════════════════════════════════════════════
     STATUS BAR
════════════════════════════════════════════════════════════ -->
<div class="status-bar">
  <span class="sb-dot idle" id="sb-dot"></span>
  <span id="sb-text">Connecting…</span>
  <div class="sb-right" id="sb-right"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     NEW SESSION MODAL
════════════════════════════════════════════════════════════ -->
<div id="new-modal" class="modal-overlay hidden">
  <div class="modal" style="width:580px">
    <h2>New Session</h2>
    <label>Label <input id="f-label" placeholder="my-task" /></label>
    <label>Host
      <select id="f-host">
        <option value="local">local (Windows host)</option>
        <option value="wsl">wsl (distro)</option>
      </select>
    </label>
    <label id="f-distro-row" class="hidden">WSL distro <select id="f-distro"></select></label>
    <label id="f-repos-row" class="hidden">Repository <select id="f-repos"></select></label>
    <label>Working directory <input id="f-cwd" placeholder="E:/GitHub/app  or  /home/user/app" /></label>
    <label>Extra repos / directories
      <textarea id="f-extra-dirs" rows="3" placeholder="One path per line — extra repos Claude can read and edit"></textarea>
    </label>
    <label>Model <input id="f-model" placeholder="(blank = plan default)" /></label>
    <label>Mode
      <select id="f-mode">
        <option value="bypassPermissions">Auto (full access) — runs everything unattended</option>
        <option value="acceptEdits">Auto-accept edits — edits run, commands ask</option>
        <option value="default">Ask before edits — prompts you to approve</option>
        <option value="plan">Plan (read-only) — plans, no changes</option>
      </select>
    </label>
    <label>Reasoning effort
      <select id="f-effort">
        <option value="">Default</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="xhigh">Extra high</option>
        <option value="max">Max</option>
      </select>
    </label>
    <label>Extended thinking
      <select id="f-thinking">
        <option value="">Auto</option>
        <option value="adaptive">Adaptive (always on)</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label class="check-row"><input type="checkbox" id="f-browser" /> Enable browser tools (Playwright)</label>
    <label class="check-row"><input type="checkbox" id="f-autocontinue" checked /> Auto-continue after 5-hour reset</label>
    <label>Initial prompt <textarea id="f-prompt" rows="3" placeholder="What should this agent do?"></textarea></label>
    <div class="modal-actions">
      <button id="f-cancel" class="btn-secondary">Cancel</button>
      <button id="f-create" class="btn-primary">Create Session</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     APPROVAL MODAL
════════════════════════════════════════════════════════════ -->
<div id="approval-modal" class="modal-overlay hidden">
  <div class="modal" style="width:540px">
    <h2>Tool Approval</h2>
    <div id="approval-body" class="approval-body"></div>
    <div class="modal-actions">
      <button id="appr-deny" class="btn-secondary">Deny</button>
      <button id="appr-allow" class="btn-primary">Allow</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     INSTRUCTIONS MODAL
════════════════════════════════════════════════════════════ -->
<div id="instr-modal" class="modal-overlay hidden">
  <div class="modal" style="width:600px">
    <h2>Session Instructions</h2>
    <div class="instr-path" id="instr-folder"></div>
    <div id="instr-list" class="instr-list"></div>
    <div class="instr-add">
      <input id="instr-name" placeholder="filename.md" style="width:200px" />
      <textarea id="instr-content" rows="5" placeholder="Instruction content (markdown)…"></textarea>
    </div>
    <div class="modal-actions">
      <button id="instr-close" class="btn-secondary">Close</button>
      <button id="instr-read" class="btn-secondary">📖 Read Instructions</button>
      <button id="instr-save" class="btn-primary">Save File</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     HISTORY ITEM MODAL
════════════════════════════════════════════════════════════ -->
<div id="history-modal" class="modal-overlay hidden">
  <div class="modal" style="width:700px;max-height:80vh">
    <h2 id="hist-modal-title">Session Transcript</h2>
    <div id="hist-modal-meta" style="font-size:12px;color:var(--vsc-muted);margin-bottom:8px"></div>
    <div id="hist-modal-body" class="messages hist-messages"></div>
    <div class="modal-actions">
      <button id="hist-modal-close" class="btn-secondary">Close</button>
      <button id="hist-modal-resume" class="btn-primary">▸ Resume Session</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     SET RESET MODAL
════════════════════════════════════════════════════════════ -->
<div id="reset-modal" class="modal-overlay hidden">
  <div class="modal" style="width:400px">
    <h2>Set Account Reset Time</h2>
    <label>Reset time (local)
      <input type="datetime-local" id="reset-time" />
    </label>
    <div class="modal-actions">
      <button id="reset-cancel" class="btn-secondary">Cancel</button>
      <button id="reset-save" class="btn-primary">Set Reset</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
