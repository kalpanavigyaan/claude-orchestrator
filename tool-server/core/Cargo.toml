[package]
name = "tool-server-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tool-server-core"
path = "src/main.rs"

[dependencies]
# gRPC
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Token counting
tiktoken-rs = "0.6"

# Diff / patch
similar = "2"

# Graph algorithms
petgraph = "0.6"

# Persistent KV store (Cavemem)
sled = "0.34"

# Regex
regex = "1"

# AST parsing (tree-sitter)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = { package = "tree-sitter-typescript", version = "0.23" }
tree-sitter-rust = "0.23"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
