[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-server-embeddings"
version = "0.1.0"
description = "gRPC embeddings service for tool-server (FAISS + sentence-transformers)"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf>=5.27.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
